name: Test Pudge Wars units
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: treeform/setup-nim-action@v6
        with:
          nim-version: '2.2.10'
      - name: Install pinned dependencies
        run: |
          nimby create
          nimby sync nimby.lock -g
      - name: Test CLI, VM, simulation and replay units
        run: bash scripts/test_league.sh --unit
