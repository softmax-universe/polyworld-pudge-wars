name: Test Pudge Wars BASIC league
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: treeform/setup-nim-action@v6
        with:
          nim-version: '2.2.10'
      - name: Install pinned dependencies
        run: |
          nimby create
          nimby sync nimby.lock -g
      - name: Test VM, simulation, replay and runner contracts
        run: bash scripts/test_league.sh
